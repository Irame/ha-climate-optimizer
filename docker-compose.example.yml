# Copy to docker-compose.yml and adjust. The Home Assistant URL and token can
# also be set later in the web UI (Settings); the values here only seed the
# first start.
services:
  climate-optimizer:
    build: .
    # image: ghcr.io/irame/ha-climate-optimizer:latest
    container_name: climate-optimizer
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
    environment:
      HA_URL: http://homeassistant.local:8123
      HA_TOKEN: ${HA_TOKEN}  # a long-lived access token, e.g. from an .env file
      TZ: Europe/Berlin
      # The service runs as this user and takes ownership of ./data on start.
      # PUID: "1000"
      # PGID: "1000"
      # DEMO: "1"           # a simulated apartment instead of Home Assistant (data in ./data/demo-data)
