# Copy to docker-compose.yml and adjust. HA_URL and HA_TOKEN can also be left
# out and set in the web UI (Settings); set here, they win over the UI.
services:
  climate-optimizer:
    build: .
    # image: ghcr.io/irame/ha-climate-optimizer:latest
    container_name: climate-optimizer
    restart: unless-stopped
    ports:
      - "8099:8099"
    # Home Assistant on the same machine with network_mode: host is reachable
    # as host.docker.internal; on Linux Docker only defines that name when asked:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    environment:
      HA_URL: http://homeassistant.local:8123  # same machine: http://host.docker.internal:8123
      HA_TOKEN: ${HA_TOKEN}  # a long-lived access token, e.g. from an .env file
      TZ: Europe/Berlin
      # The service runs as this user and takes ownership of ./data on start.
      # PUID: "1000"
      # PGID: "1000"
      # DEMO: "1"           # a simulated apartment instead of Home Assistant (data in ./data/demo-data)
