[project]
name = "climate-optimizer"
version = "0.1.0"
description = "Plans when the AC units and heaters of an apartment run, from a learned thermal model, electricity prices and comfort costs"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
    "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climate_optimizer*"]

[tool.setuptools.package-data]
climate_optimizer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
